    <title>Audiobookshelf Bookmarks Manager</title>
    <script>
      (function () {
        function isViteWsError(err) {
          if (!err) return false;
          var msg = String(err.message || err.reason || err || '');
          var file = String(err.filename || '');
          var stack = String(err.stack || '');
          return (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            file.indexOf('@vite/client') !== -1 ||
            stack.indexOf('@vite/client') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (e) {
            if (
              isViteWsError(e) ||
              isViteWsError(e.error) ||
              (e.target && typeof WebSocket !== 'undefined' && e.target instanceof WebSocket)
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (isViteWsError(e.reason)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
