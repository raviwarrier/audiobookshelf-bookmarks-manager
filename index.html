<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audiobookshelf Bookmarks Manager</title>
    <script>
      (function () {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function (url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(' ') : String(protocols || '');
            var urlStr = String(url || '');
            var isViteHmr =
              protoStr.includes('vite') ||
              urlStr.includes('token=') ||
              urlStr.includes('@vite/client');
            if (isViteHmr) {
              var listeners = {};
              return {
                readyState: 1,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                url: urlStr,
                protocol: Array.isArray(protocols) ? protocols[0] : (protocols || ''),
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                addEventListener: function (type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function () {
                      try { fn({ type: 'open' }); } catch (_) {}
                    }, 0);
                  }
                },
                removeEventListener: function (type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function (f) { return f !== fn; });
                  }
                },
                dispatchEvent: function () { return true; },
                send: function () {},
                close: function () {}
              };
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function (a) { return String((a && a.message) || a || ''); }).join(' ');
          if (str.includes('vite') && (str.includes('websocket') || str.includes('WebSocket') || str.includes('failed to connect'))) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        function isViteWsError(err) {
          if (!err) return false;
          var msg = String(err.message || err.reason || err || '');
          var file = String(err.filename || '');
          var stack = String(err.stack || '');
          return (
            msg.includes('WebSocket') ||
            msg.includes('createWebSocketModuleRunnerTransport') ||
            file.includes('@vite/client') ||
            stack.includes('@vite/client')
          );
        }
        window.addEventListener(
          'error',
          function (e) {
            if (
              isViteWsError(e) ||
              isViteWsError(e.error) ||
              (e.target && typeof WebSocket !== 'undefined' && e.target instanceof WebSocket)
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (isViteWsError(e.reason)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
